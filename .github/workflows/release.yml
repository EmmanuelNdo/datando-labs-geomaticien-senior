name: Publier le skill

# Une release est publiée (ou mise à jour) à chaque modification du skill sur main.
# Pour une nouvelle version, changez simplement le numéro dans le fichier VERSION.
on:
  push:
    branches: [main]
    paths:
      - "geomaticien-senior-open-source/**"
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Construire l'archive du skill
        run: |
          mkdir -p dist
          zip -r dist/geomaticien-senior-open-source.zip geomaticien-senior-open-source -x "*.DS_Store"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }} : Géomaticien senior open source"
          target_commitish: ${{ github.sha }}
          files: dist/geomaticien-senior-open-source.zip
          body: |
            **Installation dans Claude** : téléchargez `geomaticien-senior-open-source.zip` ci-dessous, sans le décompresser, puis importez-le dans les paramètres de Claude, rubrique Skills.

            **Installation dans Claude Code** : copiez le dossier `geomaticien-senior-open-source` dans `~/.claude/skills/`.
